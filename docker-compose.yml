version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: prism-db
    restart: always
    environment:
      POSTGRES_USER: prism_user
      POSTGRES_PASSWORD: prism_password
      POSTGRES_DB: prism_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism_user -d prism_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-setup:
    build:
      context: .
      target: builder
    container_name: prism-db-setup
    environment:
      DATABASE_URL: postgresql://prism_user:prism_password@db:5432/prism_db
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push"

  web:
    build:
      context: .
      target: runner
    container_name: prism-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://prism_user:prism_password@db:5432/prism_db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=prism_super_secret_key_123
      - HF_TOKEN=${HF_TOKEN:-}
      - GITHUB_ID=${GITHUB_ID:-}
      - GITHUB_SECRET=${GITHUB_SECRET:-}
    depends_on:
      db-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy

volumes:
  postgres_data:
