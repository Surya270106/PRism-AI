version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: prism-db
    restart: always
    environment:
      POSTGRES_USER: prism_user
      POSTGRES_PASSWORD: prism_password
      POSTGRES_DB: prism_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism_user -d prism_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-setup:
    build:
      context: .
      target: builder
    container_name: prism-db-setup
    environment:
      DATABASE_URL: postgresql://prism_user:prism_password@db:5432/prism_db
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push"

  web:
    build:
      context: .
      target: runner
    container_name: prism-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://prism_user:prism_password@db:5432/prism_db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=prism_super_secret_key_123
      - HF_TOKEN=${HF_TOKEN:-}
      - GITHUB_ID=${GITHUB_ID:-}
      - GITHUB_SECRET=${GITHUB_SECRET:-}
      - ORCHESTRATOR_URL=http://orchestrator:8001/api/v1/review
    depends_on:
      db-setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      orchestrator:
        condition: service_started

  orchestrator:
    image: python:3.11-slim
    container_name: prism-orchestrator
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    environment:
      - USE_LOCAL_MODEL=true
      - USE_CLAUDE_FALLBACK=true
      - LLAMA_SERVER_URL=http://inference:8000/review
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    command: >
      sh -c "pip install -r apps/orchestrator/requirements.txt && 
             python apps/orchestrator/main.py"
    depends_on:
      - inference

  inference:
    image: python:3.11-slim
    container_name: prism-inference
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=../training/checkpoints/prism-llama-3b_final
    command: >
      sh -c "pip install -r ml/inference/requirements.txt && 
             python ml/inference/server.py"

volumes:
  postgres_data:
